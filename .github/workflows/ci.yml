name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: 离线测试 (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.9 是 README 声明的最低版本，只在仍提供该构建的 runner 上验证
        include:
          - python-version: "3.9"
            os: ubuntu-22.04
          - python-version: "3.12"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 项目零第三方依赖，不需要 pip install
      - name: 端到端、文档一致性与离线自检
        run: python3 -m unittest discover -s tests -v
